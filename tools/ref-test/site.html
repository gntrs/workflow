<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planted ref</title>
<!-- planted values for node tools/ref-read.mjs --self-test. no h3 on purpose: it must read as missing. -->
<style>
  * { box-sizing: border-box; }
  html { background: #ffffff; }
  body { margin: 0; background: #fafaf7; color: #22221f; font-family: "Planted Text", sans-serif; font-size: 17px; line-height: 26px; }
  header { border-bottom: 1px solid #dddcd5; padding: 12px 24px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  h1 { font-family: "Planted Display", serif; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
  h2 { font-family: "Planted Display", serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
  .gone { display: none; }
  button { background: #1f6feb; color: #ffffff; border: 0; border-radius: 7px; height: 40px; padding: 0 18px; font-size: 15px; }
  input { border: 1px solid #c8c8c0; border-radius: 5px; height: 38px; padding: 0 10px; font-size: 16px; background: #ffffff; color: #22221f; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { height: 48px; border-bottom: 1px solid #e5e5e0; }
</style>
</head>
<body>
  <header>planted</header>
  <main class="wrap">
    <h1>the planted page</h1>
    <h2>a list</h2>
    <button class="gone">hidden, never the first visible button</button>
    <button>save</button>
    <input placeholder="search">
    <ul>
      <li>first row</li>
      <li>second row</li>
    </ul>
  </main>
</body>
</html>
