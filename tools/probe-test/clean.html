<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clean page</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  main { max-width: 640px; margin: 0 auto; }
  button, .button { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; padding: 0 16px; }
  img { max-width: 100%; height: auto; display: block; }
</style></head>
<body>
  <main>
    <h1>a clean page</h1>
    <p>a sentence with <a href="#more">an inline link</a> in it, which is type, not a target.</p>
    <button>one button</button>
    <a class="button" href="#more">a link that looks like a button</a>
    <p id="more">more text, wrapping at every width without pushing the page sideways.</p>
  </main>
</body></html>
