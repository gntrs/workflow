<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a page locked by overflow hidden</title>
<style>
  html, body { overflow: hidden; height: 100%; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
  .tall { height: 1400px; }
  .ok { min-width: 44px; min-height: 44px; }
</style></head>
<body>
  <h1>locked</h1>
  <!-- planted: the page cannot scroll, so the button below the screen is unreachable at every size -->
  <div class="tall">content</div>
  <button class="ok">load more</button>
</body></html>
