name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  install:
    name: installer, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the upgrade cases install old commits with their own installer
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install.sh, fresh, upgrade, edits, uninstall
        if: runner.os != 'Windows'
        run: bash scripts/test-install.sh
      - name: install.ps1, the same cases
        shell: bash
        run: bash scripts/test-install.sh ps1
  check:
    name: check and tool self tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: bash scripts/check.sh   # the private name scan is skipped here: its list is never committed
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:tools
